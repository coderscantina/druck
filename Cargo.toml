[package]
name = "kyber"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
hypher = { version = "0.1.8", default-features = false, features = ["alloc", "english", "german"] }
krilla = "0.8.2"
krilla-svg = "0.8.1"
png = "0.18.1"
pulldown-cmark = { version = "0.13.4", default-features = false }
rustybuzz = "0.20.1"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
usvg = { version = "0.47", default-features = false, features = ["text"] }
zune-jpeg = "0.5.15"

[dev-dependencies]
jsonschema = { version = "0.58.6", default-features = false }
