[package]
name = "druck"
version = "26.10.7"
edition = "2024"
description = "Typesets Markdown as PDF with optimal line breaking, footnotes, columns, tables, and JSON themes, fully offline"
authors = ["Michael Wallner <m.wallner@coderscantina.com>"]
license = "MIT"
repository = "https://github.com/coderscantina/druck"
homepage = "https://github.com/coderscantina/druck"
readme = "README.md"
keywords = ["markdown", "pdf", "typesetting", "typography", "cli"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
fontdb = "0.23.0"
hypher = { version = "0.1.8", default-features = false, features = ["alloc", "english", "german"] }
krilla = "0.8.2"
krilla-svg = "0.8.1"
png = "0.18.1"
pulldown-cmark = { version = "0.13.4", default-features = false }
rustybuzz = "0.20.1"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
unicode-segmentation = "1.13.3"
usvg = { version = "0.47", default-features = false, features = ["text"] }
zune-jpeg = "0.5.15"

[dev-dependencies]
jsonschema = { version = "0.58.6", default-features = false }

# Smaller release binaries (11.9 MB to 8.2 MB measured on macOS) at the cost of a
# longer release build. Sample PDFs are byte-identical to the default profile.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
