</style></head><body><div id="root"></div><script>
const T1='The Time Traveller (for so it will be convenient to speak of him) was expounding a recondite matter to us. His pale grey eyes shone and twinkled.';
const T3='Our chairs, being his patents, embraced and caressed us rather than submitted to be sat upon.';
const T4='And he put it to us in this way, marking the points with a lean forefinger, as we sat and lazily admired his earnestness over this new paradox.';
const tb=`<div class="tb"><div class="d"><i></i><i></i><i></i></div><div class="sw"><span class="on">Write</span><span>Publish</span></div></div>`;
const tk=`<div class="tk">${Array(12).fill(0).map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>`;
const tx=(a='')=>`<div class="tx"><small>CHAPTER I</small><h1>Introduction</h1><p>${T1}</p><p>The fire burnt brightly, and <span class="mk">the soft radiance of the incandescent lights</span> in the lilies of silver caught the bubbles that flashed and passed in our glasses.</p><p>${T3} <span class="mk">That luxurious atmosphere</span> ran free.</p><p>${T4}</p>${a}</div>`;
const win=(h,i)=>`<div class="fr" data-h="${h}"><div class="w" style="height:${h}px">${i}</div></div>`;
const note=(t,s,q,ac='<span>Apply</span><span>Reply</span><span>Dismiss</span>')=>`<div class="nt"><b>${t}</b>${s}${q?`<div class="q2">${q}</div>`:''}<div class="ac">${ac}</div></div>`;
const n1=note('Tighter?','Two "lights" within one sentence of the next paragraph.','the soft radiance of the lamps');
const n2=note('Continuity','Chapter 4 calls this room "the smoking-room".','','<span>Go to chapter 4</span><span>Dismiss</span>');
const f=(l,v)=>`<div class="fl"><label>${l}</label><div>${v}</div></div>`;
const H=[['The agent: margin and chat together','Three ways to join them. One axis: what the conversation is attached to. In all three, nothing shows until you ask, and a note is a proposal the author applies.',[
['M1. Margin notes, chat on call','Recommended','Results land as notes beside the passage. ⌘J opens a small chat card for anything book-wide, and closing it leaves the notes. Text stays centre, and the two jobs stay clearly apart.',win(560,tb+`<div class="m">${tk}<div class="col">${tx()}</div><div class="mg">${n1}${n2}</div><div class="chat"><div class="me">Check this chapter for continuity with the rest of the book.</div><div class="ms">Read 27 chapters. Left 2 notes here and 3 in chapter 4.</div><div class="pr">Ask about the book<span>⌘J</span></div></div></div>`)],
['M2. Docked conversation','','Chat stays in a right column and proposals are cards inside it, with marks in the text linking across. Closest to the panel you have, but it costs a 300 px column and pulls the eye off the page.',win(470,tb+`<div class="m">${tk}<div class="col">${tx()}</div><div class="dock"><div class="lb">Agent</div><div class="me">Check this chapter for continuity.</div><div class="ms">Read 27 chapters. Two things here:</div><div class="cd">Two "lights" close together.<div class="q2">the soft radiance of the lamps</div><div class="ac"><span>Apply</span><span>Dismiss</span></div></div><div class="cd">Chapter 4 calls this "the smoking-room".<div class="ac"><span>Go to chapter 4</span></div></div><div class="pr">Ask about the book<span>⌘J</span></div></div></div>`)],
['M3. Every thread on a passage','','No separate chat. You select text and ask, and the conversation grows in the margin there. A book-wide question attaches to the chapter title. One concept and the most writerly, but long tool-heavy turns get cramped in a 230 px column.',win(470,tb+`<div class="m">${tk}<div class="col">${tx()}</div><div class="mg"><div class="nt"><b>You</b>Is this too ornate for the opening?<div style="margin-top:7px"><b>Agent</b>A little. "Radiance" and "incandescent" both reach for the same effect.</div><div class="q2">the soft light of the lamps</div><div class="ac"><span>Apply</span><span>Dismiss</span></div></div><div class="pr" style="margin:0">Reply</div></div></div>`)]]],
['All 30 theme sections, kept minimal','All three sit in Publish\'s Style tab at the same 236 px. One axis: how you reach a section.',[
['','','S1 index and detail (recommended): a searchable list, one section at a time, with a back link. S2 accordion: everything in one scroll. S3 groups: a segment strip, then sections. In every option the proof slip\'s foot names the paragraph\'s style, as a link to its section.',win(440,`<div class="pns"><div class="pl"><h4>S1 index</h4><div class="lb">Style</div><div class="sr">Search 30 sections</div><div class="gl">Page</div><div class="rw">Geometry<span>A5</span></div><div class="rw">Running heads</div><div class="gl">Text</div><div class="rw">Body<span>10.5 pt</span></div><div class="rw">Headings</div><div class="rw">Lists</div><div class="gl">Book parts</div><div class="rw on">Chapter openings</div><div class="rw">Contents</div><div class="rw">Bibliography</div></div><div class="pl"><h4>S1 detail</h4><div class="lb">Style</div><div class="bk">‹ All sections</div><div class="ttl">Chapter openings</div>${f('Start on','Odd pages')}${f('Sink','4 lines')}${f('Drop capital','3 lines')}<div class="hr"></div>${f('Ornament','None')}</div><div class="pl"><h4>S2 accordion</h4><div class="lb">Style</div><div class="sr">Search</div><div class="acc">Geometry<span>›</span></div><div class="acc">Body<span>›</span></div><div class="acc on">Chapter openings<span>⌄</span></div>${f('Start on','Odd pages')}${f('Sink','4 lines')}<div class="acc">Contents<span>›</span></div><div class="acc">Bibliography<span>›</span></div></div><div class="pl" style="border:0"><h4>S3 groups</h4><div class="lb">Style</div><div class="seg"><span>Page</span><span>Text</span><span class="on">Parts</span><span>Notes</span></div><div class="gl">Chapter openings</div>${f('Start on','Odd pages')}${f('Sink','4 lines')}<div class="hr"></div><div class="gl">Contents</div>${f('Leader','Dots')}${f('Depth','2 levels')}</div></div>`)]]],
['Local history, scrubbing a chapter','A first picture of the bet you picked, for reference. Drag along the strip, restore a paragraph or the chapter, and name a draft.',[['','','',win(330,tb+`<div class="m"><div class="col"><div class="tx" style="width:560px"><small>CHAPTER I · TUESDAY 21:14</small><p>${T1}</p><p>The fire burnt <span class="del">very</span> brightly, and the soft radiance of the <span class="add">incandescent</span> lights caught the bubbles that flashed and passed in our glasses.</p></div></div></div><div class="fo"><span>Draft 2</span><div class="sc">${Array(44).fill(0).map((_,i)=>`<i class="${i==31?'on':i%11==0?'d':''}"></i>`).join('')}</div><span class="bt">Restore paragraph</span><span class="bt">Name this draft</span></div>`)]]]];
root.innerHTML=H.map(([t,s,vs])=>`<section class="b"><h2>${t}</h2><p>${s}</p>${vs.map(([n,r,d,w])=>`<div class="v">${n?`<h3>${n}${r?`<em>${r}</em>`:''}</h3>`:''}${d?`<p>${d}</p>`:''}${w}</div>`).join('')}</section>`).join('');
const fit=()=>{const z=root.clientWidth/900;document.querySelectorAll('.fr').forEach(f=>{f.firstChild.style.zoom=z;f.style.height=f.dataset.h*z+'px'})};fit();addEventListener('resize',fit);
</script></body></html>
