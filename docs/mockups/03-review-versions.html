.b{margin:0 0 22px}.b h2{font-size:17px;font-weight:600;margin:6px 0 2px}.b>p{margin:0 0 12px;font-size:13px;opacity:.75}.v{margin:0 0 18px}.v h3{font-size:14px;font-weight:600;margin:0 0 2px}.v h3 em{font-style:normal;font-weight:500;font-size:11px;margin-left:6px;color:var(--primary)}.v p{margin:0 0 8px;font-size:12.5px;opacity:.75}.fr{overflow:hidden;border-radius:9px;border:1px solid var(--border)}
.w{--bg:#161616;--pn:#1c1c1c;--rs:#2a2a2a;--fd:#232323;--dv:#303030;--tx:#ededed;--q:#a6a6a6;--f:#6f6f6f;--ac:#e06c4f;width:900px;background:var(--bg);color:var(--tx);font:12.5px/1.4 -apple-system,system-ui,sans-serif;display:flex;flex-direction:column;position:relative}
.tb{height:30px;flex:none;display:flex;align-items:center;padding:0 10px;position:relative}.tb .d{display:flex;gap:6px}.tb .d i{width:9px;height:9px;border-radius:50%;background:var(--rs)}.sw{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:2px;font-size:11.5px}.sw span{padding:2px 9px;border-radius:5px;color:var(--q)}.sw .on{background:var(--rs);color:var(--tx)}
.m{flex:1;display:flex;min-height:0;position:relative}.col{flex:1;overflow:hidden;display:flex;justify-content:center}.tx{width:500px;padding:24px 0 0;font:15px/1.54 'Iowan Old Style','Palatino',Georgia,serif}.tx small{display:block;font-size:11.5px;letter-spacing:.14em;color:var(--q);margin-bottom:3px}.tx p{margin:0 0 .7em}.tx h1{font:600 25px/1.2 'Iowan Old Style','Palatino',Georgia,serif;margin:0 0 12px}
.sn{background:color-mix(in srgb,var(--ac) 26%,transparent)}.del{background:color-mix(in srgb,#e5766b 24%,transparent);text-decoration:line-through}.add{background:color-mix(in srgb,#6fcf8a 22%,transparent)}.car{display:inline-block;width:2px;height:1.05em;background:var(--ac);vertical-align:-2px}
.cd{background:var(--pn);border:1px solid var(--dv);border-radius:8px;box-shadow:0 12px 34px #0007;font-size:12px}.pr{height:29px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;color:var(--q)}.ac{display:flex;gap:6px;align-items:center}.bt{height:21px;padding:0 7px;display:inline-flex;align-items:center;border:1px solid var(--dv);border-radius:4px;font-size:11px;color:var(--q)}.go{color:var(--ac)}
.fo{height:50px;flex:none;border-top:1px solid var(--dv);padding:0 14px;display:flex;align-items:center;gap:14px;font-size:11.5px;color:var(--q)}.sc{flex:1;height:30px;display:flex;align-items:center;justify-content:space-between}.sc i{width:1.5px;height:7px;background:var(--f);opacity:.7;display:block}.sc i.d{height:23px;width:2px;background:var(--tx);opacity:1}.sc i.on{height:27px;width:2px;background:var(--ac);opacity:1}

</style></head><body><div id="root"></div><script>
const T1='The Time Traveller (for so it will be convenient to speak of him) was expounding a recondite matter to us. His pale grey eyes shone and twinkled.';
const T3='Our chairs, being his patents, embraced and caressed us rather than submitted to be sat upon.';
const T4='And he put it to us in this way, marking the points with a lean forefinger, as we sat and lazily admired his earnestness over this new paradox.';
const tb=`<div class="tb"><div class="d"><i></i><i></i><i></i></div><div class="sw"><span class="on">Write</span><span>Publish</span></div></div>`;
const win=(h,i)=>`<div class="fr" data-h="${h}"><div class="w" style="height:${h}px">${i}</div></div>`;
const strip=Array(46).fill(0).map((_,i)=>`<i class="${i==33?'on':[6,19,28,41].includes(i)?'d':''}"></i>`).join('');
const chg=`<div class="rw">4 Time Travelling<span>+312 words</span></div><div class="rw">5 In the Golden Age<span>+48, −120</span></div>`;
const H=[['The agent as an IDE-style writing partner','One key, ⌘J: with a selection it works on the selection, without one it opens the book-wide chat. Changes show as tinted edits with Accept and Reject per passage. Margin notes stay for advice that changes nothing.',[
['Selection edit','','Select, ⌘J, say what you want. Same flow as an inline edit in a modern IDE.',win(330,tb+`<div class="m"><div class="col"><div class="tx"><p>${T1}</p><p>The fire burnt brightly, and <span class="sn">the soft radiance of the incandescent lights in the lilies of silver caught the bubbles</span> that flashed and passed in our glasses.</p><div class="cd" style="font:12px/1.4 -apple-system,system-ui,sans-serif;margin:2px 0 12px"><div class="pr"><span style="color:var(--tx)">Simpler, and keep the silver<span class="car" style="margin-left:2px"></span></span><span>⏎</span></div></div><p>${T3}</p></div></div></div>`)],
['Review of a passage or a chapter','','What came back, in the book\'s own type. A whole chapter arrives the same way, one reviewable passage after another, with Accept all at the foot.',win(350,tb+`<div class="m"><div class="col"><div class="tx"><small>CHAPTER I</small><p>${T1}</p><p>The fire burnt brightly, and <span class="del">the soft radiance of the incandescent lights in the lilies of silver caught the bubbles</span> <span class="add">the lamps in their silver lilies caught the bubbles</span> that flashed and passed in our glasses.</p><div class="ac" style="font-family:-apple-system,system-ui,sans-serif;margin:-2px 0 12px"><span class="bt go">Accept</span><span class="bt">Reject</span><span class="bt">Try again</span></div><p>${T4}</p></div></div></div><div class="fo"><span>3 changes to review in this chapter</span><span style="flex:1"></span><span class="bt go">Accept all</span><span class="bt">Reject all</span></div>`)]]],
['Git and local history','Two tiers. Local history keeps small changes automatically outside the repo, as JetBrains does, and Git holds the versions you mean. One axis: where versions live on screen.',[
['V1. One timeline, ⌘S saves a version','Recommended','Autosave already handles every keystroke, so ⌘S gets a better job: it saves a Git version. The strip shows both tiers: tall marks are versions, small ticks are local history that never reaches Git. Hidden until opened with ⌘Y.',win(420,tb+`<div class="m"><div class="col"><div class="tx"><small>CHAPTER IV · TUESDAY 21:14</small><p>${T1}</p><p>The fire burnt <span class="del">very</span> brightly, and the soft radiance of the <span class="add">incandescent</span> lights caught the bubbles.</p></div></div><div class="cd" style="position:absolute;left:50%;top:128px;transform:translateX(-50%);width:390px;padding-bottom:9px"><div class="lb">Save version</div><div class="fd" style="margin-top:9px;color:var(--tx)">Finish the Golden Age scene</div>${chg}<div class="ac" style="justify-content:flex-end;margin:7px 12px 0"><span class="bt">Save and sync</span><span class="bt go">Save version ⏎</span></div></div></div><div class="fo"><span>Draft: second-ending</span><div class="sc">${strip}</div><span>Synced</span></div>`)],
['V2. Git panel','','A panel like Zed\'s or VS Code\'s: changes, message, history list, branches. Familiar to developers and the most complete, but it brings a developer\'s panel into a writing app.',win(420,tb+`<div class="m"><div class="col"><div class="tx" style="width:440px"><small>CHAPTER IV</small><h1>Time Travelling</h1><p>${T1}</p><p>${T3}</p></div></div><div class="pl"><div class="lb">Versions</div><div class="gl">Branch</div><div class="fd">second-ending ▾</div><div class="gl">Changed</div>${chg}<div class="fd" style="height:46px">Message</div><div class="ac" style="justify-content:flex-end;margin:0 12px"><span class="bt">Sync</span><span class="bt go">Save version</span></div><div class="gl">History</div><div class="rw">Finish the Golden Age<span>2h</span></div><div class="rw">Rework the opening<span>Mon</span></div><div class="rw">First full draft<span>Oct 28</span></div></div></div>`)]]]];
root.innerHTML=H.map(([t,s,vs])=>`<section class="b"><h2>${t}</h2><p>${s}</p>${vs.map(([n,r,d,w])=>`<div class="v"><h3>${n}${r?`<em>${r}</em>`:''}</h3><p>${d}</p>${w}</div>`).join('')}</section>`).join('');
const fit=()=>{const z=root.clientWidth/900;document.querySelectorAll('.fr').forEach(f=>{f.firstChild.style.zoom=z;f.style.height=f.dataset.h*z+'px'})};fit();addEventListener('resize',fit);
</script></body></html>
