name: CI

# Tag pushes and the release commit from scripts/release.sh run only the
# release workflow. The commit before the release commit is the one CI checks.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    if: ${{ !startsWith(github.event.head_commit.message, '🔖 release') }}
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - name: Notices are current
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/notices.py --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy with the editor module
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Clippy as a library without the CLI
        run: cargo clippy --no-default-features --lib -- -D warnings
      # Runs the unit, integration, and parity tests and the documentation tests of the crate root.
      - name: Test
        run: cargo test
      # Each example is a program that asserts what it shows.
      - name: Examples
        shell: bash
        run: |
          for file in examples/*.rs; do
            cargo run --quiet --example "$(basename "$file" .rs)"
          done
      - name: Documentation lists only the public modules
        if: matrix.os == 'ubuntu-latest'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

  # Renders every sample with the release build on each OS, from an empty
  # working directory. Fonts and hyphenation data are bundled, so the result
  # must not depend on what the runner has installed.
  render:
    if: ${{ !startsWith(github.event.head_commit.message, '🔖 release') }}
    name: render samples on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Render samples
        run: scripts/render-samples.sh target/release/druck "$RUNNER_TEMP/pdfs"
      - uses: actions/upload-artifact@v4
        with:
          name: pdfs-${{ matrix.os }}
          path: ${{ runner.temp }}/pdfs/*.pdf
          if-no-files-found: error

  # Layout must be identical across platforms. The PDFs have no timestamps, so
  # the comparison starts at bytes. See scripts/check-pdfs.sh for the fallback.
  compare:
    name: compare PDFs across OSes
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pdfs-*
          path: pdfs
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Compare and check fonts
        run: scripts/check-pdfs.sh pdfs

  # The desktop app builds on macOS only. It is not part of the root package's
  # default members, so the jobs above do not build it, and nothing here
  # changes what they test.
  desktop:
    if: ${{ !startsWith(github.event.head_commit.message, '🔖 release') }}
    name: desktop on macos-latest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt -p druck-desktop --check
      - name: Notices are current
        run: python3 scripts/notices.py --desktop --check
      - name: Build
        run: cargo build -p druck-desktop --locked
      - name: Clippy
        run: cargo clippy -p druck-desktop --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test -p druck-desktop --locked
