name: Release

# Builds and packages binaries for five targets. A manual run keeps them as
# workflow artifacts. A tag push from scripts/release.sh also creates the GitHub
# release with the newest CHANGELOG.md section. See docs/RELEASE.md.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds run on the oldest hosted image to keep the glibc requirement low.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, smoke: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, smoke: true }
          - { target: aarch64-apple-darwin, os: macos-latest, smoke: true }
          # Cross-built on the arm64 runner, so it is packaged but not run.
          - { target: x86_64-apple-darwin, os: macos-latest, smoke: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, smoke: true }
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # The scripts need Python 3.11 or newer, the Linux images ship 3.10.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Render samples with the release binary
        if: matrix.smoke
        run: scripts/render-samples.sh target/${{ matrix.target }}/release/druck "$RUNNER_TEMP/pdfs"
      - name: Package
        run: python3 scripts/package.py ${{ matrix.target }} target/${{ matrix.target }}/release/druck${{ contains(matrix.target, 'windows') && '.exe' || '' }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: druck-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against the version and commit
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          expected="v$version-$(git rev-parse --short=7 HEAD)"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "tag $GITHUB_REF_NAME does not match $expected" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: druck-*
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk '/^## /{n++; next} n==1' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Druck $GITHUB_REF_NAME" --notes-file notes.md
