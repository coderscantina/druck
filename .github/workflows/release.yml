name: Release

# Builds and packages binaries for five targets. A manual run keeps them as
# workflow artifacts. A tag push from scripts/release.sh also creates the GitHub
# release with the newest CHANGELOG.md section. The desktop job builds the macOS app. On a manual run it is ad-hoc
# signed and kept as a workflow artifact. On a tag it is signed with the Developer ID, notarized, and stapled, the
# update and the appcast are signed with the EdDSA key, and the publish-desktop job adds the DMG and its checksum to
# the release and replaces appcast.xml on the `appcast` pre-release, where the app's updater finds it. The CLI
# release does not wait for the desktop app.
# The secrets are listed in docs/RELEASE.md.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds run on the oldest hosted image to keep the glibc requirement low.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, smoke: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, smoke: true }
          - { target: aarch64-apple-darwin, os: macos-latest, smoke: true }
          # Cross-built on the arm64 runner, so it is packaged but not run.
          - { target: x86_64-apple-darwin, os: macos-latest, smoke: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, smoke: true }
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # The scripts need Python 3.11 or newer, the Linux images ship 3.10.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Render samples with the release binary
        if: matrix.smoke
        run: scripts/render-samples.sh target/${{ matrix.target }}/release/druck "$RUNNER_TEMP/pdfs"
      - name: Package
        run: python3 scripts/package.py ${{ matrix.target }} target/${{ matrix.target }}/release/druck${{ contains(matrix.target, 'windows') && '.exe' || '' }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: druck-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  desktop:
    name: macOS desktop app
    runs-on: macos-latest
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      # Not a secret: every signature names it.
      TEAM_ID: 3XA3ND2F7P
    steps:
      - uses: actions/checkout@v4
        with:
          # CFBundleVersion is the commit count, which needs the whole history.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # A keychain of this job's own holds the certificate and the notary credentials, and goes with the runner.
      - name: Import the signing identity and the notary key
        if: env.RELEASE == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/druck-signing.keychain-db"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign > /dev/null
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk -v team="($TEAM_ID)\"" '/"Developer ID Application: / && index($0, team) { print $2; exit }')
          if [[ -z "$identity" ]]; then
            echo "the certificate holds no Developer ID Application identity of team $TEAM_ID" >&2
            exit 1
          fi
          printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials druck-notary --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" --keychain "$keychain" > /dev/null
          rm "$RUNNER_TEMP/notary.p8"
          {
            echo "DRUCK_SIGN_IDENTITY=$identity"
            echo "DRUCK_NOTARY_PROFILE=druck-notary"
            echo "DRUCK_NOTARY_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"
      # Without the signing variables, on a manual run, the bundle is signed ad hoc.
      - name: Package Druck.app and the DMG
        if: env.RELEASE != 'true'
        run: python3 scripts/package-desktop.py --outdir dist-desktop
      - name: Package, sign, notarize, and write the appcast
        if: env.RELEASE == 'true'
        env:
          DRUCK_SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          awk '/^## /{n++; next} n==1' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          python3 scripts/package-desktop.py --outdir dist-desktop --appcast "$RUNNER_TEMP/notes.md"
      - name: Check the bundle and the image
        run: |
          codesign --verify --deep --strict --verbose=2 dist-desktop/Druck.app
          hdiutil verify dist-desktop/*.dmg
      - name: Check Gatekeeper accepts the release
        if: env.RELEASE == 'true'
        run: |
          spctl --assess --type execute --verbose dist-desktop/Druck.app
          xcrun stapler validate dist-desktop/*.dmg
      - name: Remove the signing keychain
        if: always() && env.DRUCK_NOTARY_KEYCHAIN != ''
        run: security delete-keychain "$DRUCK_NOTARY_KEYCHAIN"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-aarch64-apple-darwin
          path: |
            dist-desktop/*.dmg*
            dist-desktop/appcast.xml
          if-no-files-found: error

  publish-desktop:
    name: Desktop app on the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-aarch64-apple-darwin
          path: dist-desktop
      # The feed lives on a release of its own, the pre-release `appcast`, which is never latest. Only this job
      # replaces its appcast.xml, after the DMG is up, so a release without a desktop build leaves the feed naming
      # the last DMG there is.
      - name: Add the DMG and point the feed at it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist-desktop
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" ./*.dmg ./*.dmg.sha256
          if ! gh release view appcast --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create appcast --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Desktop update feed" --notes "The feed the desktop app checks for updates. Each release replaces appcast.xml."
          fi
          # --clobber deletes the old appcast.xml before the new one is up, so a failed upload would leave installed
          # apps with no feed. Installed apps fetch this fixed address, so a new name cannot stand in: try again, and
          # fail the job where the owner sees it, as running it again puts the feed back.
          for attempt in 1 2 3 4 5; do
            if gh release upload appcast --repo "$GITHUB_REPOSITORY" --clobber appcast.xml; then
              exit 0
            fi
            echo "the appcast upload failed (attempt $attempt of 5)" >&2
            sleep $((attempt * 5))
          done
          echo "::error::appcast.xml is not on the appcast release; installed apps find no updates until this job runs again"
          exit 1

  publish:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against the version and commit
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          expected="v$version-$(git rev-parse --short=7 HEAD)"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "tag $GITHUB_REF_NAME does not match $expected" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: druck-*
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk '/^## /{n++; next} n==1' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Druck $GITHUB_REF_NAME" --notes-file notes.md
