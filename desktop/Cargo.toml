[package]
name = "druck-desktop"
version = "0.0.0"
edition = "2024"
description = "Native desktop composer and theme editor for Druck"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
druck = { path = ".." }
# Weekly snapshots of Zed's gpui crates, pinned exactly because any snapshot may change the API.
# 0.3.11 is zed@f816e1f.
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", default-features = false, features = ["font-kit", "runtime_shaders"] }
# The preview rasterizes pages itself, see preview/raster.rs. All three are permissively licensed and, with
# the image crate that gpui uses, already in the lockfile through krilla and gpui.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = { version = "0.47", default-features = false, features = ["text", "raster-images"] }
skrifa = "0.42"
