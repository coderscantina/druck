[package]
name = "druck-desktop"
version = "0.0.0"
edition = "2024"
description = "Native desktop composer and theme editor for Druck"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
druck = { path = "..", default-features = false, features = ["editor"] }
serde_json = "1.0.151"
# Weekly snapshots of Zed's gpui crates, pinned exactly because any snapshot may change the API.
# 0.3.11 is zed@f816e1f.
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", default-features = false, features = ["font-kit", "runtime_shaders"] }
regex = { version = "1.13", default-features = false, features = ["std", "unicode"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
unicode-segmentation = "1.13.3"
# The preview rasterizes pages itself, see preview/raster.rs. All three are permissively licensed and, with
# the image crate that gpui uses, already in the lockfile through krilla and gpui.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = { version = "0.47", default-features = false, features = ["text", "raster-images"] }
skrifa = "0.42"
# Persistence: the folder watcher and the diffs under its three-way merge. notify is CC0-1.0, similar Apache-2.0.
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
notify = "8.2"
similar = { version = "3.2", default-features = false, features = ["std"] }

[target.'cfg(target_os = "macos")'.dependencies]
# renamex_np, so an autosave cannot overwrite a file another program wrote a moment before.
libc = "0.2"
